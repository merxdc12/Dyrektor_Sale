name: Pinterest OS regression checks
on:
  push:
    paths:
      - 'pinterest_os/**'
      - 'tests/**'
      - '.github/workflows/board-checks.yml'
  workflow_dispatch:
jobs:
  board-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest "PyQt6>=6.6,<7"
      - name: Compile all application and test modules
        run: python -m compileall -q pinterest_os tests
      - name: Board and calendar regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_board_logic.py tests/test_calendar_scheduling.py tests/test_calendar_logic.py tests/test_publishing_logic.py tests/test_carousel.py tests/test_analytics.py tests/test_analytics_import.py tests/test_analytics_metrics.py tests/test_analytics_groups.py tests/test_business_metrics.py tests/test_profit_costs.py tests/test_product_profitability.py
