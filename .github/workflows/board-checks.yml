name: Pinterest OS regression checks
on:
  push:
    paths:
      - 'pinterest_os/**'
      - 'tests/**'
      - '.github/workflows/board-checks.yml'
  workflow_dispatch:
jobs:
  board-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest "PyQt6>=6.6,<7"
      - name: Compile all application and test modules
        run: python -m compileall -q pinterest_os tests
      - name: Full regression suite (including REPORTS GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests --junitxml=pytest-results.xml
      - name: Preserve regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-os-pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
